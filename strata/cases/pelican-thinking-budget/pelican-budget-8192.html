<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Riding a Bicycle</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #e8f7ff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener("resize", resize);

    function drawCloud(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.arc(25, 5, 18, 0, Math.PI * 2);
      ctx.arc(50, 0, 22, 0, Math.PI * 2);
      ctx.arc(25, -15, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWheel(x, y, r, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.strokeStyle = "#222";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#999";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r - 6, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#bbb";
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(r - 6, 0);
        ctx.stroke();
        ctx.rotate(Math.PI / 4);
      }

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawPedal(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = "#222";
      ctx.fillRect(-10, -3, 20, 6);
      ctx.restore();
    }

    let t = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const groundY = cy + 110;

      const sky = ctx.createLinearGradient(0, 0, 0, groundY);
      sky.addColorStop(0, "#bfe6ff");
      sky.addColorStop(1, "#e8f7ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, groundY);

      ctx.fillStyle = "#ffd54f";
      ctx.beginPath();
      ctx.arc(canvas.width * 0.8, groundY * 0.35, 40, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 5; i++) {
        const x = ((i * 220 - t * 35) % (canvas.width + 200) + canvas.width + 200) % (canvas.width + 200) - 100;
        drawCloud(x, 70 + i * 35, 1);
      }

      ctx.fillStyle = "#86c470";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = "#3f4245";
      ctx.fillRect(0, groundY, canvas.width, 45);

      ctx.fillStyle = "#fff";
      for (let x = (-t * 120) % 80; x < canvas.width; x += 80) {
        ctx.fillRect(x, groundY + 20, 40, 4);
      }

      const rear = { x: cx - 80, y: groundY - 35 };
      const front = { x: cx + 80, y: groundY - 35 };
      const crank = { x: cx, y: groundY - 50 };
      const seat = { x: cx - 25, y: groundY - 105 };
      const handle = { x: cx + 60, y: groundY - 115 };

      const wheelAngle = t * 4;
      const crankAngle = t * 3;

      ctx.fillStyle = "rgba(0,0,0,0.15)";
      ctx.beginPath();
      ctx.ellipse(cx, groundY + 8, 120, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      drawWheel(rear.x, rear.y, 35, wheelAngle);
      drawWheel(front.x, front.y, 35, wheelAngle);

      ctx.strokeStyle = "#222";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(crank.x, crank.y);
      ctx.lineTo(rear.x, rear.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(crank.x, crank.y);
      ctx.lineTo(seat.x, seat.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(seat.x, seat.y);
      ctx.lineTo(handle.x, handle.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(crank.x, crank.y);
      ctx.lineTo(handle.x, handle.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(handle.x, handle.y);
      ctx.lineTo(front.x, front.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(handle.x, handle.y);
      ctx.lineTo(handle.x + 15, handle.y - 10);
      ctx.stroke();

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.ellipse(seat.x, seat.y, 18, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(crank.x, crank.y);
      ctx.rotate(crankAngle);

      ctx.strokeStyle = "#222";
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(25, 0);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-25, 0);
      ctx.stroke();

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      const p1 = {
        x: crank.x + 25 * Math.cos(crankAngle),
        y: crank.y + 25 * Math.sin(crankAngle)
      };

      const p2 = {
        x: crank.x - 25 * Math.cos(crankAngle),
        y: crank.y - 25 * Math.sin(crankAngle)
      };

      drawPedal(p1.x, p1.y, crankAngle);
      drawPedal(p2.x, p2.y, crankAngle);

      const bob = Math.sin(t * 3) * 4;
      const body = { x: cx - 15, y: groundY - 125 + bob };
      const head = { x: cx + 55, y: groundY - 155 + bob * 0.7 };

      const hip = { x: body.x + 15, y: body.y + 25 };
      const foot = p1;
      const knee = {
        x: (hip.x + foot.x) / 2 + 12,
        y: (hip.y + foot.y) / 2 + 12
      };

      ctx.strokeStyle = "#e07a3f";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(knee.x, knee.y);
      ctx.lineTo(foot.x, foot.y);
      ctx.stroke();

      ctx.fillStyle = "#e07a3f";
      ctx.beginPath();
      ctx.moveTo(foot.x, foot.y);
      ctx.lineTo(foot.x + 12, foot.y + 6);
      ctx.lineTo(foot.x - 8, foot.y + 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#f7f7f7";

      ctx.beginPath();
      ctx.ellipse(body.x, body.y, 45, 30, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(body.x - 35, body.y);
      ctx.lineTo(body.x - 70, body.y - 10);
      ctx.lineTo(body.x - 60, body.y + 15);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#f7f7f7";
      ctx.lineWidth = 18;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(body.x + 20, body.y - 10);
      ctx.quadraticCurveTo(body.x + 45, body.y - 35, head.x, head.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(head.x, head.y, 18, 0, Math.PI * 2);
      ctx.fill();

      const beakOpen = Math.max(0, Math.sin(t * 2)) * 10;

      ctx.fillStyle = "#ff9f43";
      ctx.beginPath();
      ctx.moveTo(head.x + 12, head.y + 6);
      ctx.quadraticCurveTo(head.x + 35, head.y + 30 + beakOpen, head.x + 55, head.y + 8);
      ctx.lineTo(head.x + 12, head.y + 6);
      ctx.fill();

      ctx.fillStyle = "#ff8c2b";
      ctx.beginPath();
      ctx.moveTo(head.x + 12, head.y - 4);
      ctx.lineTo(head.x + 55, head.y + 8);
      ctx.lineTo(head.x + 12, head.y + 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(head.x + 5, head.y - 5, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(body.x - 5, body.y - 5);
      ctx.rotate(Math.sin(t * 4) * 0.35);

      ctx.fillStyle = "#e6e6e6";
      ctx.beginPath();
      ctx.ellipse(0, 0, 35, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#cfcfcf";
      ctx.lineWidth = 2;

      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-20 + i * 10, -5);
        ctx.lineTo(-10 + i * 10, 12);
        ctx.stroke();
      }

      ctx.restore();
    }

    function loop() {
      t += 0.016;
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
