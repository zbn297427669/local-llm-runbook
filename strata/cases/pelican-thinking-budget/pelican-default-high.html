<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #e8f4ff; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let t = 0;

function drawWheel(x, y, r, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  ctx.strokeStyle = '#222';
  ctx.lineWidth = Math.max(3, r * 0.12);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#777';
  ctx.lineWidth = Math.max(1, r * 0.04);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.stroke();
  }

  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(2, r * 0.08), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, s, 0, Math.PI * 2);
  ctx.arc(x + s * 1.1, y + s * 0.2, s * 0.8, 0, Math.PI * 2);
  ctx.arc(x - s * 1.1, y + s * 0.2, s * 0.8, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  t += 0.016;
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#bfe6ff');
  sky.addColorStop(1, '#f7fbff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.arc(W * 0.82, H * 0.18, Math.min(40, H * 0.06), 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 4; i++) {
    const x = ((t * 30 + i * 220) % (W + 200)) - 100;
    const y = H * 0.18 + i * 35;
    drawCloud(x, y, Math.min(22, H * 0.035));
  }

  ctx.fillStyle = '#c8e6c9';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.65);
  ctx.quadraticCurveTo(W * 0.25, H * 0.55, W * 0.5, H * 0.65);
  ctx.quadraticCurveTo(W * 0.75, H * 0.75, W, H * 0.62);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  const roadY = H * 0.75;
  ctx.fillStyle = '#8bc34a';
  ctx.fillRect(0, roadY, W, H - roadY);

  ctx.fillStyle = '#546e7a';
  ctx.fillRect(0, roadY, W, Math.max(20, H * 0.04));

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = Math.max(2, H * 0.004);
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -t * 120;
  ctx.beginPath();
  ctx.moveTo(0, roadY + Math.max(10, H * 0.02));
  ctx.lineTo(W, roadY + Math.max(10, H * 0.02));
  ctx.stroke();
  ctx.setLineDash([]);

  const wheelR = Math.min(48, H * 0.08);
  const cx = W / 2;
  const cy = roadY - wheelR;
  const rearX = cx - wheelR * 1.5;
  const frontX = cx + wheelR * 1.5;
  const angle = t * 4;

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(cx, roadY, wheelR * 2.2, wheelR * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  drawWheel(rearX, cy, wheelR, angle);
  drawWheel(frontX, cy, wheelR, angle);

  const bb = { x: cx, y: cy - wheelR * 0.25 };
  const seat = { x: cx - wheelR * 0.75, y: cy - wheelR * 1.5 };
  const headTube = { x: cx + wheelR * 1.15, y: cy - wheelR * 1.3 };

  ctx.strokeStyle = '#1e88e5';
  ctx.lineWidth = Math.max(3, wheelR * 0.12);
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(rearX, cy);
  ctx.lineTo(bb.x, bb.y);
  ctx.lineTo(seat.x, seat.y);
  ctx.moveTo(bb.x, bb.y);
  ctx.lineTo(headTube.x, headTube.y);
  ctx.moveTo(seat.x, seat.y);
  ctx.lineTo(headTube.x, headTube.y);
  ctx.moveTo(headTube.x, headTube.y);
  ctx.lineTo(frontX, cy);
  ctx.stroke();

  ctx.strokeStyle = '#333';
  ctx.lineWidth = Math.max(2, wheelR * 0.06);
  ctx.beginPath();
  ctx.moveTo(headTube.x, headTube.y);
  ctx.lineTo(headTube.x + wheelR * 0.35, headTube.y - wheelR * 0.2);
  ctx.stroke();

  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(seat.x, seat.y, wheelR * 0.45, wheelR * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#333';
  ctx.lineWidth = Math.max(2, wheelR * 0.05);
  ctx.beginPath();
  ctx.arc(bb.x, bb.y, wheelR * 0.25, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(rearX, cy);
  ctx.lineTo(bb.x, bb.y - wheelR * 0.25);
  ctx.stroke();

  const crankLen = wheelR * 0.5;
  const pedal1 = {
    x: bb.x + Math.cos(angle) * crankLen,
    y: bb.y + Math.sin(angle) * crankLen
  };
  const pedal2 = {
    x: bb.x - Math.cos(angle) * crankLen,
    y: bb.y - Math.sin(angle) * crankLen
  };

  ctx.strokeStyle = '#333';
  ctx.lineWidth = Math.max(2, wheelR * 0.07);
  ctx.beginPath();
  ctx.moveTo(bb.x, bb.y);
  ctx.lineTo(pedal1.x, pedal1.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bb.x, bb.y);
  ctx.lineTo(pedal2.x, pedal2.y);
  ctx.stroke();

  const bob = Math.sin(t * 3) * wheelR * 0.12;
  const bodyX = cx - wheelR * 0.2;
  const bodyY = seat.y - wheelR * 0.75 + bob;
  const headX = cx + wheelR * 0.75;
  const headY = bodyY - wheelR * 0.85;
  const hip = { x: bodyX + wheelR * 0.2, y: bodyY + wheelR * 0.55 };

  ctx.strokeStyle = '#ff8a65';
  ctx.lineWidth = Math.max(2, wheelR * 0.08);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y);
  ctx.lineTo(pedal2.x, pedal2.y);
  ctx.stroke();

  ctx.fillStyle = '#ff8a65';
  ctx.beginPath();
  ctx.arc(pedal2.x, pedal2.y, Math.max(2, wheelR * 0.08), 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.moveTo(bodyX - wheelR * 0.75, bodyY);
  ctx.lineTo(bodyX - wheelR * 1.15, bodyY - wheelR * 0.2);
  ctx.lineTo(bodyX - wheelR * 1.05, bodyY + wheelR * 0.35);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.ellipse(bodyX, bodyY, wheelR * 0.88, wheelR * 0.67, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#f5f5f5';
  ctx.lineWidth = Math.max(4, wheelR * 0.35);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bodyX + wheelR * 0.35, bodyY - wheelR * 0.25);
  ctx.lineTo(headX - wheelR * 0.15, headY + wheelR * 0.15);
  ctx.stroke();

  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.arc(headX, headY, wheelR * 0.38, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff8a65';
  ctx.beginPath();
  ctx.moveTo(headX + wheelR * 0.2, headY - wheelR * 0.1);
  ctx.lineTo(headX + wheelR * 0.95, headY - wheelR * 0.04);
  ctx.lineTo(headX + wheelR * 0.95, headY + wheelR * 0.17);
  ctx.lineTo(headX + wheelR * 0.25, headY + wheelR * 0.2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ff7043';
  ctx.beginPath();
  ctx.moveTo(headX + wheelR * 0.25, headY + wheelR * 0.2);
  ctx.quadraticCurveTo(
    headX + wheelR * 0.6,
    headY + wheelR * 0.45 + Math.sin(t * 5) * wheelR * 0.05,
    headX + wheelR * 0.95,
    headY + wheelR * 0.17
  );
  ctx.lineTo(headX + wheelR * 0.25, headY + wheelR * 0.2);
  ctx.fill();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(headX + wheelR * 0.1, headY - wheelR * 0.1, Math.max(2, wheelR * 0.06), 0, Math.PI * 2);
  ctx.fill();

  const flap = Math.sin(t * 6) * 0.45;
  ctx.save();
  ctx.translate(bodyX, bodyY);
  ctx.rotate(flap);
  ctx.fillStyle = '#e0e0e0';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(wheelR * 0.45, -wheelR * 0.25, wheelR * 0.7, wheelR * 0.05);
  ctx.quadraticCurveTo(wheelR * 0.35, wheelR * 0.35, 0, 0);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = '#ff8a65';
  ctx.lineWidth = Math.max(2, wheelR * 0.08);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y);
  ctx.lineTo(pedal1.x, pedal1.y);
  ctx.stroke();

  ctx.fillStyle = '#ff8a65';
  ctx.beginPath();
  ctx.arc(pedal1.x, pedal1.y, Math.max(2, wheelR * 0.08), 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
