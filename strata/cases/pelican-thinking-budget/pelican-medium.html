<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pelican Riding a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const clouds = [
  { x: 0.15, y: 0.18, s: 1.0, sp: 0.012 },
  { x: 0.45, y: 0.10, s: 1.4, sp: 0.008 },
  { x: 0.75, y: 0.22, s: 0.9, sp: 0.015 },
  { x: 0.95, y: 0.14, s: 1.2, sp: 0.010 }
];

function ik(hx, hy, fx, fy, L1, L2, sign) {
  let dx = fx - hx, dy = fy - hy;
  let d = Math.hypot(dx, dy);
  d = Math.min(Math.max(d, Math.abs(L1 - L2) + 1), L1 + L2 - 1);
  const a = Math.atan2(dy, dx);
  const c = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
  const ka = a + c * sign;
  return { x: hx + L1 * Math.cos(ka), y: hy + L1 * Math.sin(ka) };
}

function drawWheel(cx, cy, r, ang) {
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, r - 6, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const a = ang + i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + (r - 6) * Math.cos(a), cy + (r - 6) * Math.sin(a));
    ctx.stroke();
  }

  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 25 * s, y + 6 * s, 16 * s, 0, Math.PI * 2);
  ctx.arc(x - 25 * s, y + 8 * s, 14 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawLeg(hx, hy, fx, fy, sign, color) {
  const knee = ik(hx, hy, fx, fy, 45, 45, sign);
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(knee.x, knee.y);
  ctx.lineTo(fx, fy);
  ctx.stroke();
  // foot
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(fx, fy, 5, 0, Math.PI * 2);
  ctx.fill();
}

function draw(t) {
  const W = canvas.width, H = canvas.height;
  const omega = 2.2;
  const ang = t * omega;
  const bob = Math.sin(t * 4) * 6;
  const headBob = Math.sin(t * 4 + 0.5) * 4;

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#87ceeb');
  sky.addColorStop(1, '#dff3f7');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = '#ffd76e';
  ctx.beginPath();
  ctx.arc(W * 0.85, H * 0.15, 40, 0, Math.PI * 2);
  ctx.fill();

  // clouds
  for (const c of clouds) {
    const x = ((c.x - t * c.sp) % 1.2 + 1.2) % 1.2 * W - W * 0.1;
    drawCloud(x, c.y * H, c.s);
  }

  const groundY = H * 0.78;
  const R = Math.min(60, H * 0.12);
  const cx = W * 0.5;
  const rearX = cx - R * 1.7, frontX = cx + R * 1.7;

  // road
  ctx.fillStyle = '#5a5a5a';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#3e3e3e';
  ctx.fillRect(0, groundY, W, 4);

  // moving dashes
  ctx.strokeStyle = '#f5f5f5';
  ctx.lineWidth = 4;
  const dashSpeed = omega * R;
  for (let i = -1; i < W / 80 + 1; i++) {
    const x = ((i * 80 - t * dashSpeed) % (W + 80) + W + 80) % (W + 80) - 40;
    ctx.beginPath();
    ctx.moveTo(x, groundY + 30);
    ctx.lineTo(x + 40, groundY + 30);
    ctx.stroke();
  }

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(cx, groundY + 6, R * 3.4, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  const rearC = { x: rearX, y: groundY - R };
  const frontC = { x: frontX, y: groundY - R };
  const bb = { x: (rearX + frontX) / 2, y: groundY - R - 12 };

  // key points
  const seat = { x: rearX + R * 0.55, y: groundY - R - 78 + bob };
  const handle = { x: frontX - R * 0.35, y: groundY - R - 88 };
  const crankR = 17;
  const pedal1 = { x: bb.x + crankR * Math.cos(ang), y: bb.y + crankR * Math.sin(ang) };
  const pedal2 = { x: bb.x + crankR * Math.cos(ang + Math.PI), y: bb.y + crankR * Math.sin(ang + Math.PI) };

  const hip = { x: seat.x + 4, y: seat.y - 4 };
  const shoulder = { x: seat.x + 38, y: seat.y - 34 + bob * 0.5 };

  // far leg
  drawLeg(hip.x, hip.y, pedal2.x, pedal2.y, -1, '#c9a14a');

  // far wing holding handlebar
  ctx.strokeStyle = '#c9a14a';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(shoulder.x, shoulder.y);
  ctx.quadraticCurveTo(shoulder.x + 30, shoulder.y + 25, handle.x, handle.y);
  ctx.stroke();

  // wheels
  drawWheel(rearC.x, rearC.y, R, ang);
  drawWheel(frontC.x, frontC.y, R, ang);

  // frame
  ctx.strokeStyle = '#d33';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const seatTubeTop = { x: seat.x, y: seat.y - 2 };
  ctx.beginPath();
  ctx.moveTo(bb.x, bb.y); ctx.lineTo(seatTubeTop.x, seatTubeTop.y); // seat tube
  ctx.moveTo(bb.x, bb.y); ctx.lineTo(rearC.x, rearC.y);             // chain stay
  ctx.moveTo(seatTubeTop.x, seatTubeTop.y); ctx.lineTo(rearC.x, rearC.y); // seat stay
  ctx.moveTo(bb.x, bb.y); ctx.lineTo(handle.x, handle.y);           // down tube
  ctx.moveTo(handle.x, handle.y); ctx.lineTo(frontC.x, frontC.y);   // fork
  ctx.stroke();

  // handlebar
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(handle.x, handle.y);
  ctx.lineTo(handle.x + 14, handle.y - 6);
  ctx.stroke();

  // seat
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(seat.x, seat.y, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // crank
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(pedal1.x, pedal1.y);
  ctx.lineTo(bb.x, bb.y);
  ctx.lineTo(pedal2.x, pedal2.y);
  ctx.stroke();

  // pelican body
  const body = { x: seat.x + 14, y: seat.y - 30 + bob };
  ctx.fillStyle = '#f4f4f0';
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(body.x, body.y, 42, 30, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // tail
  ctx.fillStyle = '#e8e8e2';
  ctx.beginPath();
  ctx.moveTo(body.x - 38, body.y - 5);
  ctx.lineTo(body.x - 62, body.y - 18);
  ctx.lineTo(body.x - 58, body.y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // neck
  const head = { x: body.x + 52, y: body.y - 44 + headBob };
  ctx.strokeStyle = '#f4f4f0';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(body.x + 25, body.y - 12);
  ctx.quadraticCurveTo(body.x + 45, body.y - 30, head.x, head.y);
  ctx.stroke();

  // head
  ctx.fillStyle = '#f4f4f0';
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(head.x, head.y, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // beak + pouch
  const flap = Math.sin(t * 3) * 4;
  ctx.strokeStyle = '#e8a33c';
  ctx.fillStyle = '#f0b95a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(head.x + 6, head.y - 4);
  ctx.lineTo(head.x + 52, head.y - 2 + flap * 0.3);
  ctx.lineTo(head.x + 50, head.y + 4);
  ctx.quadraticCurveTo(head.x + 30, head.y + 16 + flap, head.x + 8, head.y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // upper beak line
  ctx.strokeStyle = '#c98a2e';
  ctx.beginPath();
  ctx.moveTo(head.x + 6, head.y - 4);
  ctx.lineTo(head.x + 52, head.y - 2 + flap * 0.3);
  ctx.stroke();

  // eye
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(head.x + 4, head.y - 3, 3, 0, Math.PI * 2);
  ctx.fill();

  // near leg
  drawLeg(hip.x, hip.y, pedal1.x, pedal1.y, 1, '#e0b65a');

  // near wing (flapping)
  const wingAng = -0.6 + Math.sin(t * 3.5) * 0.35;
  ctx.save();
  ctx.translate(shoulder.x, shoulder.y);
  ctx.rotate(wingAng);
  ctx.fillStyle = '#e9e9e3';
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(14, 10, 26, 12, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

let start = performance.now();
function loop(now) {
  const t = (now - start) / 1000;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
