<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
  html, body { height: 100%; margin: 0; background: #111; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas { width: min(900px, 95vw); height: auto; aspect-ratio: 900 / 520; background: #87ceeb; border-radius: 16px; box-shadow: 0 12px 35px rgba(0,0,0,.35); }
</style>
</head>
<body>
<canvas id="scene" width="900" height="520"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 900, H = 520;
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

const groundY = 440;
const wheelR = 70;
const rearX = 300, frontX = 600, wheelY = groundY - wheelR;
const bb = { x: 450, y: wheelY };
const saddle = { x: 420, y: 290 };
const headTube = { x: 560, y: 290 };
const handlebar = { x: 580, y: 270 };
const crankR = 30;
const speed = 140;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mod(a, b) { return ((a % b) + b) % b; }

function drawBackground(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#9fd8ff');
  sky.addColorStop(1, '#e8f7ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255, 245, 180, .9)';
  ctx.beginPath();
  ctx.arc(760, 90, 45, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 5; i++) {
    const x = mod(i * 180 - t * 30, W + 200) - 100;
    const y = 60 + i * 35;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.arc(x + 30, y + 8, 28, 0, Math.PI * 2);
    ctx.arc(x + 60, y, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#b7e4c7';
  ctx.beginPath();
  ctx.moveTo(0, 360);
  ctx.quadraticCurveTo(180, 300, 360, 360);
  ctx.quadraticCurveTo(540, 320, 720, 360);
  ctx.quadraticCurveTo(820, 340, 900, 360);
  ctx.lineTo(900, H);
  ctx.lineTo(0, H);
  ctx.fill();

  ctx.fillStyle = '#3b4252';
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.fillStyle = '#f4f4f4';
  for (let i = 0; i < 12; i++) {
    const x = mod(i * 80 - t * speed, W + 80) - 40;
    ctx.fillRect(x, groundY + 35, 45, 6);
  }

  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.ellipse(450, groundY + 18, 180, 18, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawWheel(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  ctx.strokeStyle = '#222';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, r - 8, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo((r - 8) * Math.cos(i * Math.PI / 4), (r - 8) * Math.sin(i * Math.PI / 4));
    ctx.stroke();
  }

  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFrame() {
  ctx.save();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';

  ctx.beginPath(); ctx.moveTo(rearX, wheelY); ctx.lineTo(bb.x, bb.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bb.x, bb.y); ctx.lineTo(saddle.x, saddle.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(saddle.x, saddle.y); ctx.lineTo(headTube.x, headTube.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bb.x, bb.y); ctx.lineTo(headTube.x, headTube.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(headTube.x, headTube.y); ctx.lineTo(frontX, wheelY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(headTube.x, headTube.y); ctx.lineTo(handlebar.x, handlebar.y); ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(saddle.x, saddle.y, 28, 8, -0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawChain(angle) {
  ctx.save();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(rearX, wheelY);
  ctx.lineTo(bb.x, bb.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(bb.x, bb.y, 22, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawCrank(angle) {
  ctx.save();
  ctx.translate(bb.x, bb.y);
  ctx.rotate(angle);

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(crankR, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-crankR, 0); ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.fillRect(crankR - 4, -3, 8, 6);
  ctx.fillRect(-crankR - 4, -3, 8, 6);

  ctx.restore();
}

function ik(hx, hy, px, py, l1, l2, sign) {
  const dx = px - hx, dy = py - hy;
  let d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(l1 - l2) + 1, l1 + l2 - 1);
  const phi = Math.atan2(dy, dx);
  const cos = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
  const theta = Math.acos(clamp(cos, -1, 1));
  return {
    x: hx + l1 * Math.cos(phi + theta * sign),
    y: hy + l1 * Math.sin(phi + theta * sign)
  };
}

function drawLeg(hx, hy, px, py, sign) {
  const knee = ik(hx, hy, px, py, 48, 48, sign);
  ctx.save();
  ctx.strokeStyle = '#e8a33d';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(knee.x, knee.y);
  ctx.lineTo(px, py);
  ctx.stroke();

  ctx.fillStyle = '#e8a33d';
  ctx.beginPath(); ctx.arc(knee.x, knee.y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPelican(t, angle) {
  const bob = Math.sin(t * 3) * 4;
  const headBob = bob + Math.sin(t * 7) * 2;
  const tailWag = Math.sin(t * 4) * 5;
  const body = { x: 430, y: 250 + bob };
  const head = { x: 525, y: 205 + headBob };
  const hip = { x: 430, y: 280 + bob };

  const pedalNear = {
    x: bb.x + crankR * Math.cos(angle),
    y: bb.y + crankR * Math.sin(angle)
  };
  const pedalFar = {
    x: bb.x + crankR * Math.cos(angle + Math.PI),
    y: bb.y + crankR * Math.sin(angle + Math.PI)
  };

  drawLeg(hip.x, hip.y, pedalFar.x, pedalFar.y, 1);

  ctx.save();
  ctx.fillStyle = '#f7f7f7';
  ctx.beginPath();
  ctx.moveTo(body.x - 45, body.y + 10 + tailWag);
  ctx.quadraticCurveTo(body.x - 70, body.y - 10 + tailWag, body.x - 55, body.y - 25);
  ctx.quadraticCurveTo(body.x - 30, body.y - 15, body.x - 20, body.y + 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#f7f7f7';
  ctx.beginPath();
  ctx.ellipse(body.x, body.y, 55, 42, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d8d8d8';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  const flap = Math.sin(t * 5) * 0.25;
  ctx.translate(body.x, body.y);
  ctx.rotate(flap);
  ctx.fillStyle = '#e9e9e9';
  ctx.beginPath();
  ctx.moveTo(-10, -10);
  ctx.quadraticCurveTo(25, -35, 45, -10);
  ctx.quadraticCurveTo(20, 15, -10, 10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#cfcfcf';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#e9e9e9';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(body.x + 10, body.y - 10);
  ctx.quadraticCurveTo(body.x + 35, body.y - 20, handlebar.x, handlebar.y);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#f7f7f7';
  ctx.lineWidth = 22;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(body.x + 15, body.y - 10);
  ctx.quadraticCurveTo(body.x + 45, body.y - 35, head.x, head.y);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#f7f7f7';
  ctx.beginPath();
  ctx.arc(head.x, head.y, 24, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d8d8d8';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(head.x + 8, head.y - 4, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(head.x + 9, head.y - 5, 1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f4a261';
  ctx.beginPath();
  ctx.moveTo(head.x + 10, head.y - 2);
  ctx.lineTo(head.x + 75, head.y + 2);
  ctx.lineTo(head.x + 70, head.y + 10);
  ctx.lineTo(head.x + 15, head.y + 8);
  ctx.closePath();
  ctx.fill();

  const pouchOpen = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.fillStyle = '#f7c48d';
  ctx.beginPath();
  ctx.moveTo(head.x + 15, head.y + 8);
  ctx.quadraticCurveTo(head.x + 45, head.y + 35 + pouchOpen * 10, head.x + 70, head.y + 10);
  ctx.lineTo(head.x + 15, head.y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  drawLeg(hip.x, hip.y, pedalNear.x, pedalNear.y, -1);
}

function drawMotion(t) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const y = 180 + i * 25;
    const x = mod(700 - t * speed * 1.2 + i * 120, W + 100) - 50;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 45, y);
    ctx.stroke();
  }
  ctx.restore();
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  drawBackground(t);
  drawMotion(t);

  const angle = t * speed / wheelR;
  drawWheel(rearX, wheelY, wheelR, angle);
  drawWheel(frontX, wheelY, wheelR, angle);
  drawFrame();
  drawChain(angle);
  drawCrank(angle);
  drawPelican(t, angle);
}

let start = performance.now();
function loop(now) {
  const t = (now - start) / 1000;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
